steps:
  # Build the Hocuspocus server image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - -f
      - Dockerfile.hocuspocus
      - -t
      - $_IMAGE
      - .

 # Push the image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE

  # Deploy to Cloud Run
  # IMPORTANT: max-instances=1 is required for WebSocket-based Y.js collaboration.
  # Hocuspocus keeps Y.js documents in memory — if Cloud Run scales to multiple
  # instances, two clients may land on different instances with separate document
  # state and will never sync. Single-instance is the correct topology for a
  # stateful WebSocket server. Scale vertically (cpu/memory) if needed.
  #
  # min-instances=0: scale to zero when idle. The client has IndexedDB-backed local
  # persistence and automatic reconnection with exponential backoff, so a cold start
  # (~2-5s) is handled transparently. This eliminates ~$0.90/day in idle instance costs.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_IMAGE
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --min-instances=0
      - --max-instances=1
      - --timeout=3600s
      - --cpu=1
      - --memory=512Mi
      # Browsers open this WebSocket directly, so the service must be publicly
      # reachable; authentication happens at the application layer, where
      # onAuthenticate verifies a signed collaboration token and re-checks
      # document access against the database. `--no-allow-unauthenticated` was
      # set here but never took effect (the deploy's IAM step failed while the
      # live service kept an allUsers invoker binding). Applying it would have
      # cut every browser off from collaboration.
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production
      - --update-secrets=DATABASE_URL=DATABASE_URL:latest,COLLABORATION_TOKEN_SECRET=digital-garden-collaboration-token-secret:2


images:
  - $_IMAGE

substitutions:
  _SERVICE_NAME: digital-garden-hocuspocus
  # PINNED to us-west1 — the region the app actually connects to
  # (NEXT_PUBLIC_HOCUSPOCUS_URL → …-uw.a.run.app).
  #
  # This said us-central1 until 2026-07-20, while the client pointed at
  # us-west1. Two identically-named services existed in both regions, so every
  # deploy shipped correctly to a service nothing talked to, and the serving
  # revision sat untouched from 2026-04-16 — three redeploys "succeeded" while
  # the live crash never changed. The us-central1 service has been deleted;
  # do not reintroduce a second region without repointing the client.
  _REGION: us-west1
  _IMAGE: us-west1-docker.pkg.dev/digital-garden-482805/digital-garden-containers/digital-garden-hocuspocus
