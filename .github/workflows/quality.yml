name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Required for type-aware lint rules that reference generated Prisma client.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # The lint script has a `--max-warnings` ratchet (the number lives in
      # package.json) so new code cannot drift past the current warning count.
      # To lower the cap, reduce that number once warnings have been fixed.
      - name: Lint
        run: pnpm lint

  # Every validation gate the `build` chain runs, DERIVED from package.json
  # rather than listed here. Adding a gate used to need two registrations — the
  # build chain and a workflow step — and nothing failed if you skipped the
  # second: 11 of 24 had drifted that way by 2026-10-15, including
  # `handles:check`, `private:content:check`, `blockid:hygiene:check` and
  # `extensions:check`, each guarding a silent-failure class nothing else
  # catches. A hand-maintained list here would drift again, so
  # scripts/run-build-gates.ts reads the `build` script itself.
  # ~26s for the whole chain, so it runs unfiltered on every PR.
  gates:
    name: Validation gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Types only — no gate connects to a database.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build-chain validation gates
        run: pnpm ci:gates

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Playbook parser checks
        run: pnpm charters:check

      - name: Output-target checks
        run: pnpm output-targets:check

      # The picker's row walk: eligibility decides what can be PICKED, folders
      # are always browsed (a notes-only picker once listed only top-level notes).
      - name: Picker tree checks
        run: pnpm picker:tree:check

      # The tree never flashes its skeleton after a mutation (it unmounted
      # react-arborist and lost the user's place); delete is optimistic.
      - name: Smooth tree checks
        run: pnpm tree:smooth:check

      # One REST save of a note at a time, per NOTE: an overlapping save used
      # to carry a stale X-Body-Hash and 409 against the user's own write.
      - name: Note save coordinator checks
        run: pnpm note-save:check

      # The Google Drive upload body is built from CRLF bytes: string-literal
      # CRLFs were folded by the production minifier into bare LFs, and
      # every Drive upload failed "Malformed multipart body." for months.
      - name: Google Drive multipart body checks
        run: pnpm google:multipart:check

      # One search query builder, the conversion backup at every
      # serializer-driven write, MCP capabilities and the MCP read seam.
      - name: MCP preparatory layer checks
        run: pnpm mcp:prep:check

      # The MCP server's contract: flat schemas, annotations, capability
      # checks on every write, one write path, one read seam, bearer auth.
      - name: MCP server surface checks
        run: pnpm mcp:surface:check

      # Sleeping tabs wake on an outside write (the stamp on the presence
      # poll) and a merge with their own edits is reported, never dialogued.
      - name: Remote-write wake and merge notice
        run: pnpm remote-write:wake:check

  markdown-safety:
    name: Markdown block-safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Asserts every registered TipTap block survives a markdown round-trip
      # losslessly (dg-block fences). A new block that can't round-trip fails
      # here rather than silently destroying user content via the source-view
      # toggle. Structural smoke covers the markdown → tiptap parse direction.
      - name: Markdown block-safety gate
        run: pnpm markdown:blocks:check

      - name: Markdown round-trip smoke
        run: pnpm markdown:smoke

      # Comment threads (COMMENTS-ANNOTATIONS-PLAN §4): the strip-the-mark
      # predicate, the CriticMarkup grammar, every markdown/HTML seam calling
      # the predicate, and the mark's editor commands under jsdom.
      - name: Comments gate
        run: pnpm comments:check

      # OCR text → paste-ready blocks (lib/features/ocr/reflow.ts): which line
      # ends are word-wraps and which are real breaks, and the hand-off to the
      # markdown paste parser. Mutation-tested (13 mutants killed, 2026-10-06).
      - name: OCR reflow gate
        run: pnpm ocr:blocks:check
