name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Required for type-aware lint rules that reference generated Prisma client.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # The lint script has `--max-warnings 175` as a ratchet so new code
      # cannot drift past the current warning count. To lower the cap,
      # reduce the number in package.json once warnings have been fixed.
      - name: Lint
        run: pnpm lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Playbook parser checks
        run: pnpm charters:check

      - name: Output-target checks
        run: pnpm output-targets:check

  markdown-safety:
    name: Markdown block-safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Asserts every registered TipTap block survives a markdown round-trip
      # losslessly (dg-block fences). A new block that can't round-trip fails
      # here rather than silently destroying user content via the source-view
      # toggle. Structural smoke covers the markdown → tiptap parse direction.
      - name: Markdown block-safety gate
        run: pnpm markdown:blocks:check

      - name: Markdown round-trip smoke
        run: pnpm markdown:smoke
