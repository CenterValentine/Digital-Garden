name: Collaboration Hardening

on:
  pull_request:
    paths:
      - "app/api/collaboration/**"
      - "components/content/editor/**"
      - "lib/domain/collaboration/**"
      - "server/hocuspocus/**"
      - "scripts/validate-collaboration-schema.ts"
      - "scripts/validate-collab-lineage.ts"
      - "lib/domain/content/save-meta.ts"
      - "app/api/content/content/*/route.ts"
      - "components/content/content/MainPanelContent.tsx"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main

jobs:
  schema:
    name: Collaboration schema and types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is a gitignored build artifact — typecheck needs
      # it generated first, else new models (SearchConnection, SitePage, …)
      # are missing from the client type and tsc fails. Mirrors quality.yml.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate collaboration schema
        run: pnpm collab:schema:check

      # A collaborator joining must never double a note: the load catches up
      # on the stored lineage, solo saves carry their Y copy, rival copies
      # align before connecting. Drives the real documents.ts, no database.
      - name: Validate collaboration lineage
        run: pnpm collab:lineage:check
